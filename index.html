<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Baranos AI × Fogo L1 Video Generator</title>
  <style>
    :root {
      --bg: #090d16;
      --accent: #58a6ff;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      font-family: var(--font);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 960px;
      width: 100%;
    }

    /* Video Canvas Player */
    canvas {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #090d16;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(88, 166, 255, 0.25);
    }

    .controls-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: rgba(18, 24, 38, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 24px;
      backdrop-filter: blur(10px);
    }

    .status-text {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .status-text span {
      color: var(--accent);
      font-weight: 600;
    }

    .btn-group {
      display: flex;
      gap: 12px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.16);
    }

    .btn-primary {
      background: var(--accent);
      color: #090d16;
      border-color: var(--accent);
    }

    .btn-primary:hover:not(:disabled) {
      background: #79c0ff;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <canvas id="stage" width="1920" height="1080"></canvas>

    <div class="controls-panel">
      <div class="status-text" id="statusLabel">Status: <span>Ready</span></div>
      <div class="btn-group">
        <button class="btn" id="previewBtn">Preview Animation</button>
        <button class="btn btn-primary" id="downloadBtn">Render & Download Video</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const previewBtn = document.getElementById('previewBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusLabel = document.getElementById('statusLabel');

    // Load Logos
    const logoBaranos = new Image();
    logoBaranos.src = 'logo-baranos.jpg';
    const logoFogo = new Image();
    logoFogo.src = 'logo-fogo.jpg';

    // Slide Deck Content
    const slides = [
      {
        tag: "WHITEPAPER V2.0",
        title: "BARANOS AI × FOGO L1",
        subtitle: "Neutral Intelligence as Blockchain Infrastructure. Deterministic, challengeable LLM inference settled natively on SVM.",
        cards: [
          { h: "DETERMINISTIC", p: "Identical committed run yields identical output." },
          { h: "CHALLENGEABLE", p: "Optimistic settlement with onchain replay." },
          { h: "COMPOSABLE", p: "Outputs consumed as native smart contract state." }
        ]
      },
      {
        tag: "THE AI TRUST DILEMMA",
        title: "Why Web3 Cannot Trust Private AI APIs",
        subtitle: "Offchain opaque models introduce centralization vectors into decentralized protocols.",
        cards: [
          { h: "Ordinary Web2 Inference", p: "Silent weight updates. Floating-point drift. Opacity behind proprietary APIs." },
          { h: "Baranos Verifiable Primitive", p: "Frozen runtime hashes. Committed prompt templates. Fully reproducible onchain." }
        ]
      },
      {
        tag: "MATHEMATICAL REPRODUCIBILITY",
        title: "The Anatomy of a Canonical Job",
        formula: "Model Commitment + Pinned Weights + Input Hash + Strict Policy = One Canonical Output",
        cards: [
          { h: "Model & Weights", p: "Immutable hash commitment." },
          { h: "Runtime Profile", p: "Strict quantization semantics." },
          { h: "Greedy Decoding", p: "Zero sampling variance." },
          { h: "Output Bounds", p: "Strict schema constraints." }
        ]
      },
      {
        tag: "SETTLEMENT PROTOCOL",
        title: "Confirmation Mode vs Replay Mode",
        subtitle: "Dual execution balancing performance with guaranteed cryptographic adjudication.",
        cards: [
          { h: "MODE 01 Confirmation Mode", p: "Standard optimistic pipeline. Fast offchain compute. Cryptographic receipts posted onchain." },
          { h: "MODE 02 Replay Mode", p: "Heavyweight deterministic execution. Full onchain SVM runtime. Slashing keeps executors honest." }
        ]
      },
      {
        tag: "INFRASTRUCTURE",
        title: "Consensus & Settlement Layer",
        subtitle: "Why Baranos deployed directly on Fogo L1.",
        cards: [
          { h: "~60s", p: "Target result and dispute resolution window." },
          { h: "SVM L1", p: "Firedancer-grade high-throughput architecture." },
          { h: "Sub-Cent", p: "Predictable micro-fees for frequent verification." }
        ]
      },
      {
        tag: "PIPELINE",
        title: "Workflow Engine",
        subtitle: "The complete lifecycle of verifiable inference.",
        cards: [
          { h: "01 Job Creation", p: "Commit model and inputs." },
          { h: "02 Offchain Run", p: "Execute inference efficiently." },
          { h: "03 Post Receipt", p: "Publish result onchain." },
          { h: "04 Dispute Path", p: "Replay verification on Fogo." }
        ]
      },
      {
        tag: "SYSTEM DESIGN",
        title: "Core Architecture Objects",
        subtitle: "Four composable onchain state registries.",
        cards: [
          { h: "Model Registry", p: "Weight hashes and profiles." },
          { h: "Input Registry", p: "Merkleized evidence sets." },
          { h: "Inference Policy", p: "Decoding and prompt rules." },
          { h: "Result Account", p: "Confirmed onchain records." }
        ]
      },
      {
        tag: "COMPARISON",
        title: "Trust Minimization",
        table: [
          ["SYSTEM", "WHAT APPS MUST TRUST", "WHAT CAN BE AUDITED"],
          ["Private AI API", "Single corporate provider", "Usually nothing"],
          ["Human Oracle", "Collusion cartels", "Votes cast post-facto"],
          ["Baranos on Fogo", "Committed code & policy", "Full execution trace"]
        ]
      },
      {
        tag: "CONSENUS MODEL",
        title: "Execution vs Social Consensus",
        formula: "\"Fogo supplies consensus over what was computed, not editorial control.\"",
        cards: [
          { h: "Consensus Role", p: "Finalizes technical state dispute resolution without subjective review." },
          { h: "Economic Shield", p: "Staked FOGO tokens secure execution history." }
        ]
      },
      {
        tag: "ECONOMICS",
        title: "Two Decoupled Economic Layers",
        subtitle: "Aligning incentives between compute executors and validators.",
        cards: [
          { h: "Inference Market", p: "Compensates compute executors and challengers. Denominated in bounties or stablecoins." },
          { h: "Blockspace Market", p: "Secures transaction inclusion, state settlement, and replay. Fueled by native FOGO gas." }
        ]
      },
      {
        tag: "USE CASES",
        title: "Initial Scope: Prediction Markets",
        subtitle: "Neutral deterministic intelligence powering autonomous onchain contracts.",
        cards: [
          { h: "Prediction Markets", p: "Frozen natural-language resolution." },
          { h: "Parametric Insurance", p: "Evaluates committed real-world evidence." },
          { h: "DAO Governance", p: "Verifies proposal compliance." }
        ]
      },
      {
        tag: "THE END STATE",
        title: "Neutral Intelligence on SVM",
        formula: "“A smart contract should call intelligence with the same confidence it calls code.”",
        subtitle: "Baranos AI and Fogo transform opaque LLM inferences into public, verifiable, neutral state.",
        footer: "#BaranosAI • #FogoL1 • #VerifiableAI"
      }
    ];

    // Canvas Slide Drawing Engine
    function drawSlide(slide, opacity = 1, offsetY = 0) {
      ctx.save();
      ctx.globalAlpha = opacity;

      // Background
      ctx.fillStyle = '#090d16';
      ctx.fillRect(0, 0, 1920, 1080);

      // Radial ambient lighting
      const glow = ctx.createRadialGradient(960, 540, 50, 960, 540, 800);
      glow.addColorStop(0, 'rgba(56, 92, 196, 0.22)');
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, 1920, 1080);

      // Persistent Top Header & Logos
      ctx.save();
      // Left: Baranos Logo
      if (logoBaranos.complete && logoBaranos.naturalWidth !== 0) {
        ctx.drawImage(logoBaranos, 80, 50, 64, 64);
      }
      ctx.font = '700 24px sans-serif';
      ctx.fillStyle = '#8b949e';
      ctx.fillText('BARANOS AI', 160, 90);

      // Right: Fogo Logo
      ctx.textAlign = 'right';
      ctx.fillText('FOGO L1', 1760, 90);
      if (logoFogo.complete && logoFogo.naturalWidth !== 0) {
        ctx.drawImage(logoFogo, 1776, 50, 64, 64);
      }
      ctx.restore();

      // Slide Content Offset
      ctx.translate(0, offsetY);

      // Category Tag
      ctx.font = '700 22px sans-serif';
      ctx.fillStyle = '#58a6ff';
      ctx.fillText(slide.tag, 160, 260);

      // Title
      ctx.font = '800 58px sans-serif';
      ctx.fillStyle = '#f0f6fc';
      ctx.fillText(slide.title, 160, 335);

      let currentY = 385;

      // Formula Banner
      if (slide.formula) {
        ctx.fillStyle = 'rgba(88, 166, 255, 0.08)';
        ctx.fillRect(160, currentY, 1600, 70);
        ctx.strokeStyle = 'rgba(88, 166, 255, 0.3)';
        ctx.strokeRect(160, currentY, 1600, 70);

        ctx.font = '500 26px monospace';
        ctx.fillStyle = '#79c0ff';
        ctx.textAlign = 'center';
        ctx.fillText(slide.formula, 960, currentY + 44);
        ctx.textAlign = 'left';
        currentY += 105;
      }

      // Subtitle
      if (slide.subtitle) {
        ctx.font = '400 28px sans-serif';
        ctx.fillStyle = '#8b949e';
        ctx.fillText(slide.subtitle, 160, currentY);
        currentY += 70;
      }

      // Cards Grid
      if (slide.cards) {
        const count = slide.cards.length;
        const totalW = 1600;
        const gap = 24;
        const cardW = (totalW - gap * (count - 1)) / count;
        const cardH = 220;

        slide.cards.forEach((c, idx) => {
          const x = 160 + idx * (cardW + gap);
          ctx.fillStyle = 'rgba(18, 24, 38, 0.75)';
          ctx.fillRect(x, currentY, cardW, cardH);
          ctx.strokeStyle = 'rgba(99, 130, 255, 0.25)';
          ctx.strokeRect(x, currentY, cardW, cardH);

          // Card Header
          ctx.font = '700 24px sans-serif';
          ctx.fillStyle = '#58a6ff';
          ctx.fillText(c.h, x + 24, currentY + 46);

          // Card Body text wrapped
          ctx.font = '400 20px sans-serif';
          ctx.fillStyle = '#c9d1d9';
          wrapText(ctx, c.p, x + 24, currentY + 90, cardW - 48, 30);
        });
      }

      // Table (Slide 8)
      if (slide.table) {
        const startX = 160;
        const startY = currentY;
        const tableW = 1600;
        const rowH = 65;

        slide.table.forEach((row, rIdx) => {
          const y = startY + rIdx * rowH;
          ctx.fillStyle = rIdx === 0 ? 'rgba(255, 255, 255, 0.05)' : (rIdx === 3 ? 'rgba(88, 166, 255, 0.12)' : 'rgba(18, 24, 38, 0.75)');
          ctx.fillRect(startX, y, tableW, rowH);
          ctx.strokeStyle = 'rgba(99, 130, 255, 0.2)';
          ctx.strokeRect(startX, y, tableW, rowH);

          ctx.font = rIdx === 0 ? '700 22px sans-serif' : '500 22px sans-serif';
          ctx.fillStyle = rIdx === 0 ? '#58a6ff' : (rIdx === 3 ? '#7ee787' : '#f0f6fc');
          ctx.fillText(row[0], startX + 30, y + 40);
          ctx.fillText(row[1], startX + 500, y + 40);
          ctx.fillText(row[2], startX + 1050, y + 40);
        });
      }

      // Footer
      if (slide.footer) {
        ctx.font = '700 24px sans-serif';
        ctx.fillStyle = '#58a6ff';
        ctx.textAlign = 'center';
        ctx.fillText(slide.footer, 960, 780);
        ctx.textAlign = 'left';
      }

      ctx.restore();
    }

    function wrapText(context, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = context.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          context.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      context.fillText(line, x, y);
    }

    // Default static draw
    drawSlide(slides[0]);

    // Animation & Video Render Runner
    async function runPresentation(onFrame, onComplete) {
      const fps = 30;
      const slideDurationSec = 3.2; // 3.2s per slide (~38s total)
      const transitionSec = 0.5;    // 0.5s smooth crossfade
      const framesPerSlide = fps * slideDurationSec;
      const transitionFrames = fps * transitionSec;

      let currentSlideIdx = 0;

      while (currentSlideIdx < slides.length) {
        const nextSlideIdx = currentSlideIdx + 1;

        for (let frame = 0; frame < framesPerSlide; frame++) {
          if (nextSlideIdx < slides.length && frame >= framesPerSlide - transitionFrames) {
            // Cross-dissolve into next slide
            const t = (frame - (framesPerSlide - transitionFrames)) / transitionFrames;
            drawSlide(slides[currentSlideIdx], 1 - t, -t * 15);
            drawSlide(slides[nextSlideIdx], t, (1 - t) * 15);
          } else {
            // Normal slide hold with micro-motion
            drawSlide(slides[currentSlideIdx], 1, 0);
          }

          if (onFrame) onFrame(currentSlideIdx, frame);
          await new Promise(r => setTimeout(r, 1000 / fps));
        }

        currentSlideIdx++;
      }

      if (onComplete) onComplete();
    }

    // 1. Preview
    previewBtn.addEventListener('click', async () => {
      previewBtn.disabled = true;
      downloadBtn.disabled = true;
      statusLabel.innerHTML = 'Status: <span>Playing preview...</span>';

      await runPresentation(
        (slideIdx) => {
          statusLabel.innerHTML = `Status: <span>Slide ${slideIdx + 1} of ${slides.length}</span>`;
        },
        () => {
          previewBtn.disabled = false;
          downloadBtn.disabled = false;
          statusLabel.innerHTML = 'Status: <span>Preview finished</span>';
          drawSlide(slides[0]);
        }
      );
    });

    // 2. Direct Render & Download (NO screen sharing)
    downloadBtn.addEventListener('click', async () => {
      previewBtn.disabled = true;
      downloadBtn.disabled = true;

      // Capture directly from the HTML5 canvas
      const stream = canvas.captureStream(30);
      const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
        ? 'video/webm;codecs=vp9'
        : 'video/webm';

      const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 6000000 });
      const chunks = [];

      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Baranos_AI_Fogo_Video.webm';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 1500);

        previewBtn.disabled = false;
        downloadBtn.disabled = false;
        statusLabel.innerHTML = 'Status: <span>Downloaded successfully!</span>';
      };

      recorder.start();
      statusLabel.innerHTML = 'Status: <span>Rendering video in background...</span>';

      await runPresentation(
        (slideIdx) => {
          statusLabel.innerHTML = `Status: <span>Rendering Slide ${slideIdx + 1} of ${slides.length}...</span>`;
        },
        () => {
          recorder.stop();
        }
      );
    });
  </script>
</body>
</html>
